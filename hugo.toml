baseURL = "https://adykaaa.github.io/blog/"
languageCode = "en-us"
title = "Adam Toth"
buildFuture = true

# GitHub Pages supplies /blog/ through baseURL; omit the content section.
[permalinks.page]
  blog = "/:slugorcontentbasename/"

[params]
  author = "Adam Toth"
  description = "My thoughts on software, platform engineering, coding... and everything in general."
  subtitle = "Staff Platform Engineer @ Veeam"
  avatar = "/images/avatar.jpg"
  githubUrl = "https://github.com/adykaaa"
  linkedinUrl = "https://www.linkedin.com/in/adamtoth0814/"

[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    pageRef = "/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "About"
    pageRef = "/about"
    weight = 20

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
  [markup.highlight]
    style = "dracula"
    lineNos = false
    noClasses = true
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'
